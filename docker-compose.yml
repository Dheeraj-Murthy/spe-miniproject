services:
  calculator-api:
    build: .
    image: ${DOCKER_IMAGE:-calculator-api:local}
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      - SPRING_APPLICATION_NAME=miniproject
      - JAVA_TOOL_OPTIONS=-Xmx256m
    networks:
      - calculator-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: calculator-proxy
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator-api:
        condition: service_healthy
    networks:
      - calculator-net

networks:
  calculator-net:
    driver: bridge
