events {}

http {
    # Docker's embedded DNS server. Resolving via a variable (below) instead of
    # a static upstream block forces re-resolution on each request, so nginx
    # picks up the new container IP after a redeploy instead of caching the
    # old one until nginx itself restarts.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location / {
            set $backend "http://calculator-api:8080";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
